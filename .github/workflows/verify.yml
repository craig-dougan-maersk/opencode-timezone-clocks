name: Verify package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm audit
    - run: npm run typecheck
    - run: npm run build:check
    - run: npm run test:coverage
