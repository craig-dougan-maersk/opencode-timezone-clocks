name: Verify package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: npm
    - run: npm ci --ignore-scripts
    # Gate on the dependencies that ship, and only on high or critical findings.
    # The remaining moderates are in transitive dependencies of @opencode/plugin
    # and in dev/test tooling, none with a fix available; failing on them would
    # abort the pipeline before the checks below can run.
    - run: npm audit --omit=dev --audit-level=high
    - run: npm run typecheck
    - run: npm run build:check
    - run: npm run test:coverage
